/* ---- Descrizione composta dai campi della scheda ---- */
const MATRIX={argilla:'argillos',limo:'limos',sabbia:'sabbios','sabbia fine':'sabbios',ghiaia:'ghiaios',ghiaino:'ghiaios'};
const tk=s=>String(s||'').split(/\s*[,;]\s*/).map(x=>x.trim()).filter(Boolean);
function joinIt(a){a=a.filter(Boolean);const seen=new Set();a=a.filter(x=>{const k=x.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
  return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function composeDesc(r){
  const def=String(r.definizione||'').trim();
  if(r.tipo==='USM'){
    const parts=[cap(def)||'Struttura muraria'];
    if(r.tecnica)parts[0]+=` in ${joinIt(tk(r.tecnica))}`;
    const lat=tk(r.lat_materiali),lit=tk(r.lit_materiali),alt=tk(r.materialiAltro);
    if(lat.length)parts.push(`laterizi: ${joinIt(lat)}${tk(r.lat_lavorazione).length?' '+joinIt(tk(r.lat_lavorazione)):''}${tk(r.lat_posa).length?', posti a '+joinIt(tk(r.lat_posa)):''}`);
    if(lit.length)parts.push(`elementi litici: ${joinIt(lit)}${tk(r.lit_lavorazione).length?' '+joinIt(tk(r.lit_lavorazione)):''}${tk(r.lit_posa).length?', in '+joinIt(tk(r.lit_posa)):''}`);
    if(alt.length)parts.push(`altri materiali: ${joinIt(alt)}`);
    const comp=tk(r.leg_componenti);
    if(/secco/i.test(r.leg_tipo||''))parts.push('messa in opera a secco');
    else if(r.leg_tipo||comp.length){let l=`legante: ${r.leg_tipo||'malta'}`;if(comp.length)l+=` di ${joinIt(comp)}`;if(r.leg_colore)l+=` di colore ${r.leg_colore}`;if(r.leg_consistenza)l+=`, ${r.leg_consistenza}`;parts.push(l)}
    if(tk(r.leg_finitura).length)parts.push(`giunti: ${joinIt(tk(r.leg_finitura))}`);
    if(r.finitureOpera)parts.push(r.finitureOpera);
    if(r.orientamento)parts.push(`orientamento ${r.orientamento}`);
    return parts.length===1&&!def&&!r.tecnica?'':parts.join('; ')+'.';
  }
  const cut=/taglio|interfaccia/i.test(def)||(/buca|fossa/i.test(def)&&(r.forma||r.pareti||r.fondo));
  if(cut){
    let s=cap(def)||'Taglio';
    if(r.forma)s+=` di forma ${r.forma}`;
    const pf=[];if(r.pareti)pf.push(`pareti ${r.pareti}`);if(r.fondo)pf.push(`fondo ${r.fondo}`);
    if(pf.length)s+=(r.forma?', ':' con ')+joinIt(pf);
    if(r.orientamento)s+=` con orientamento ${r.orientamento}`;
    return s+'.';
  }
  const geo=tk(r.geologici),mat=geo.filter(g=>MATRIX[g.toLowerCase()]),incl=geo.filter(g=>!MATRIX[g.toLowerCase()]);
  let s=cap(def)||'Strato';
  if(mat.length){const seen=new Set();const adj=mat.map(g=>MATRIX[g.toLowerCase()]).filter(a=>!seen.has(a)&&seen.add(a));
    s+=` con matrice a tessitura ${adj.map((a,i)=>a+(i===adj.length-1?'a':'o')).join('-')}`}
  if(r.colore&&r.consistenza)s+=` di colore ${r.colore} e consistenza ${r.consistenza}`;
  else if(r.colore)s+=` di colore ${r.colore}`;
  else if(r.consistenza)s+=` di consistenza ${r.consistenza}`;
  if(incl.length)s+=`, con inclusi di ${joinIt(incl)}`;
  const cont=[...tk(r.organici),...tk(r.artificiali),...tk(r.elementiDatanti)].filter(x=>!/^nessun/i.test(x));
  if(cont.length)s+=`, contenente ${joinIt(cont)}`;
  if(!def&&s==='Strato')return'';
  return s+'.';
}

function fmtDate(d){if(!d)return'';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?`${m[3]}/${m[2]}/${m[1]}`:d}

/* ---- ZIP (store) per DOCX e XLSX, nessuna libreria esterna: funziona anche offline ---- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  }
  const cd=central.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cd,true);end.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(end.buffer)],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));
  let p=0;for(const a of all){out.set(a,p);p+=a.length}
  return out;
}
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');

/* ---- DOCX ---- */
function docxRun(text,opt={}){
  const rpr=`<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${opt.b?'<w:b/>':''}${opt.caps?'<w:caps/>':''}${opt.color?`<w:color w:val="${opt.color}"/>`:''}<w:sz w:val="${opt.sz||19}"/></w:rPr>`;
  const lines=String(text).split(/\r?\n/);
  return lines.map((l,i)=>`<w:r>${rpr}${i?'<w:br/>':''}<w:t xml:space="preserve">${xe(l)}</w:t></w:r>`).join('');
}
const P=(runs,opt={})=>`<w:p><w:pPr><w:spacing w:before="0" w:after="${opt.after??0}"/>${opt.jc?`<w:jc w:val="${opt.jc}"/>`:''}</w:pPr>${runs}</w:p>`;
function docxScheda(rec,sc,blank){
  const COL=803,rows=layoutRows(rec,sc,blank);

function checkRecords(recs){
  const by=new Map();const issues=[];
  recs.forEach(r=>{if(r.numProvv)issues.push({sev:'warn',kind:'provv',num:r.numero,t:`${r.numero}: numero assegnato senza connessione, verifica che sia corretto`})});
  recs.forEach(r=>{if(by.has(r.numero))issues.push({sev:'err',kind:'dup',num:r.numero,t:`Numero ${r.numero} usato da più schede`});else by.set(r.numero,r)});
  recs.forEach(r=>{
    RELS.forEach(([k])=>(r.rel?.[k]||[]).forEach(n=>{
      if(n===r.numero){issues.push({sev:'err',kind:'self',num:r.numero,k,n,t:`${r.numero}: rapporto “${RELLAB[k]}” con sé stessa`});return}
      const t=by.get(n);
      if(!t){issues.push({sev:'warn',kind:'missing',num:r.numero,k,n,t:`${r.numero} ${RELLAB[k].toLowerCase()} ${n}, ma la US ${n} non è ancora schedata`});return}
      if(!(t.rel?.[RELINV[k]]||[]).includes(r.numero))issues.push({sev:'warn',kind:'recip',num:r.numero,k,n,t:`${r.numero} ${RELLAB[k].toLowerCase()} ${n}: manca “${RELLAB[RELINV[k]].toLowerCase()} ${r.numero}” nella scheda ${n}`});
    }));
    ['definizione','descrizione','interpretazione'].forEach(f=>{if(!String(r[f]||'').trim())issues.push({sev:'info',kind:'empty',num:r.numero,f,t:`${r.numero}: campo “${f}” vuoto`})});
  });
  findCycles(recs).forEach(c=>issues.push({sev:'err',kind:'cycle',nums:c.nums,t:c.t}));
  const order={err:0,warn:1,info:2};
  return issues.sort((a,b)=>order[a.sev]-order[b.sev]||numSort(a.num||'',b.num||''));
}
/* Cicli e contraddizioni nella sequenza stratigrafica.
   Uguale a / si lega a = stesso momento (nodi uniti); copre, taglia, riempie, si appoggia = posteriore; i rapporti inversi = anteriore. */
function findCycles(recs,relOf=(r,k)=>r.rel?.[k]||[]){
  const nums=new Set(recs.map(r=>r.numero));const par=new Map([...nums].map(n=>[n,n]));
  const f=x=>{while(par.get(x)!==x)x=par.get(x);return x};
  const groups=()=>{const g=new Map();nums.forEach(n=>{const k=f(n);if(!g.has(k))g.set(k,[]);g.get(k).push(n)});return g};
  recs.forEach(r=>['uguale','silega'].forEach(k=>relOf(r,k).forEach(n=>{if(nums.has(n)){const a=f(r.numero),b=f(n);if(a!==b)par.set(a,b)}})));
  const G=groups(),lab=k=>(G.get(k)||[k]).slice().sort(numSort).join('='),out=[],seen=new Set();
  const edges=new Map();const add=(a,b,why)=>{a=f(a);b=f(b);
    if(a===b){const t=`${why[0]} e ${why[1]} risultano contemporanee (uguale a / si lega a) ma anche in sequenza fra loro`;if(!seen.has(t)){seen.add(t);out.push({nums:[...why],t})}return}
    if(!edges.has(a))edges.set(a,new Set());edges.get(a).add(b)};
  recs.forEach(r=>{POST.forEach(k=>relOf(r,k).forEach(n=>{if(nums.has(n))add(r.numero,n,[r.numero,n])}));
                   ANTE.forEach(k=>relOf(r,k).forEach(n=>{if(nums.has(n))add(n,r.numero,[n,r.numero])}))});
  const col=new Map();
  const dfs=(u,stack)=>{col.set(u,1);stack.push(u);
    for(const v of edges.get(u)||[]){if(col.get(v)===1){const cyc=stack.slice(stack.indexOf(v)).concat(v);const t='Sequenza ciclica: '+cyc.map(lab).join(' → ');
      if(!seen.has(t)){seen.add(t);out.push({nums:[...new Set(cyc.flatMap(x=>G.get(x)||[x]))],t:t+' (una US non può essere insieme anteriore e posteriore a un’altra)'})}}
      else if(!col.get(v))dfs(v,stack)}
    stack.pop();col.set(u,2)};
  [...edges.keys()].sort(numSort).forEach(u=>{if(!col.get(u))dfs(u,[])});
  return out;
}

/* Adatta un testo a un riquadro riducendo il corpo; restituisce righe, corpo e se è stato troncato */
function wrapText(text,maxW,size,bold,measure){
  const out=[];
  String(text).split(/\n/).forEach(par=>{let line='';
    par.split(/\s+/).filter(Boolean).forEach(w=>{
      while(measure(w,size,bold)>maxW&&w.length>1){let i=w.length-1;while(i>1&&measure(w.slice(0,i),size,bold)>maxW)i--;if(line){out.push(line);line=''}out.push(w.slice(0,i));w=w.slice(i)}
      const t=line?line+' '+w:w;if(!line||measure(t,size,bold)<=maxW)line=t;else{out.push(line);line=w}});
    out.push(line)});
  while(out.length&&out[out.length-1]==='')out.pop();
  return out;
}
function fitText(text,w,h,start,min,bold,measure){
  if(!String(text).trim())return{size:start,lines:[],trunc:false};
  for(let s=start;s>=min-0.01;s-=0.5){const lines=wrapText(text,w,s,bold,measure);if(lines.length*s*1.18<=h+0.5)return{size:s,lines,trunc:false}}
  const lines=wrapText(text,w,min,bold,measure);const n=Math.max(1,Math.floor(h/(min*1.18)));
  const cut=lines.slice(0,n);cut[cut.length-1]=cut[cut.length-1].replace(/\s*\S*$/,'')+' …';return{size:min,lines:cut,trunc:true};
}

function makeSheetDb(){

  const snapDoc=(id,data)=>({id,exists:data!==undefined,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});

      const cur=new Map();cache.forEach((v,pth)=>{const i=pth.indexOf('/');if(pth.slice(0,i)===path&&(!filter||v?.[filter[0]]===filter[1]))cur.set(pth.slice(i+1),v)});
      const ch=[];cur.forEach((v,id)=>{if(!s.prev.has(id))ch.push({type:'added',doc:snapDoc(id,v)});else if(JSON.stringify(s.prev.get(id))!==JSON.stringify(v))ch.push({type:'modified',doc:snapDoc(id,v)})});
      s.prev.forEach((v,id)=>{if(!cur.has(id))ch.push({type:'removed',doc:snapDoc(id,v)})});
      if(!s.first&&!ch.length)return;s.first=false;s.prev=cur;const docs=[...cur].map(([id,v])=>snapDoc(id,v));

    subs.add(s);if(loaded)s.run();return()=>subs.delete(s);
  };

    try{const j=await api('pull',{since});(j.docs||[]).forEach(d=>{if(d.deleted||!d.data)cache.delete(d.path);else cache.set(d.path,d.data)});
      since=Math.max(0,(j.now||Date.now())-10000);loaded=true;subs.forEach(x=>x.run());renderSync()}
    catch(e){}finally{polling=false}
  }
  setInterval(poll,15000);addEventListener('online',poll);addEventListener('focus',poll);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  setTimeout(poll,0);
  const pushOps=async ops=>{const j=await api('push',{ops});return j.refused||[]};
  const doc=path=>({id:path.split('/')[1],path,
    get:async()=>snapDoc(path.split('/')[1],cache.get(path)),
    set:async data=>{const rf=await pushOps([{path,data}]);if(rf.length)throw err('Non autorizzato','invalid_argument');cache.set(path,JSON.parse(JSON.stringify(data)))},
    update:async data=>{const cur=cache.get(path)||{};return doc(path).set({...cur,...data})},
    delete:async()=>{await pushOps([{path,del:true}]);cache.delete(path)},
    acquire:async({holder})=>({acquired:!!(await api('claim',{path,holder})).acquired}),
    onSnapshot:(cb)=>sub('doc',path,null,cb)});

    doc:id=>doc(name+'/'+(id||uid('x'))),onSnapshot:cb=>sub('coll',name,filter,cb)});
  return{doc,collection:n=>coll(n,null),pushMany:async ops=>{const rf=await pushOps(ops);setTimeout(poll,300);return rf},poll};
}

        }else if(c==='revoked'||c==='not_granted'||c==='capability_disabled'){db=null;break}
        else{clearTimeout(retryT);retryT=setTimeout(flush,15000);break}

    }
  }finally{flushing=false;renderSync()}
}

function renderSync(){

  else if(n){cls='warn';t=`${n} modifiche da inviare`}

}

function mergeSnap(snap,coll,filterFn){
  const store=coll==='scavi'?S.scavi:coll==='proposte'?S.prop:S.records;
  const seen=new Set();
  snap.docs.forEach(d=>seen.add(d.id));
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id;if(pending(`${coll}/${id}`))return;
    if(ch.type==='removed')delete store[id];
    else{store[id]={...ch.doc.data(),id};if(coll==='us')lastSaved.set(id,cloneRec(store[id]))}
  });
  if(!syncedOnce||coll!=='scavi'){ /* rimuovi copie locali cancellate da altri mentre eri offline */
    Object.keys(store).forEach(id=>{const o=store[id];if(filterFn(o)&&!seen.has(id)&&!pending(`${coll}/${id}`))delete store[id]});
  }
  persist();
}
function subscribeUS(){
  if(unsubUS){unsubUS();unsubUS=null}
  if(!db||!S.cur)return;
  const sc=S.cur;let first=true;
  unsubUS=db.collection('us').where('scavo','==',sc).onSnapshot(snap=>{
    if(first||snap.docChanges().length){mergeSnap(snap,'us',o=>o.scavo===sc);first=false;softRender()}
  },e=>{if(e.code==='unavailable')setTimeout(subscribeUS,5000)});
}

    db.doc('config/ruoli').onSnapshot(s=>{if(pending('config/ruoli'))return;ROLES=s.exists?{soci:[],...s.data()}:{soci:[]};softRender()},()=>{});

async function buildArchive(sc,{what,foto},msg){

/* legge gli archivi .zip creati dal Taccuino (non compressi) */
function unzipStore(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),out={};let p=0;const dec=new TextDecoder();
  while(p+30<=u8.length&&dv.getUint32(p,true)===0x04034b50){
    const method=dv.getUint16(p+8,true),size=dv.getUint32(p+18,true),nl=dv.getUint16(p+26,true),xl=dv.getUint16(p+28,true);
    const name=dec.decode(u8.subarray(p+30,p+30+nl));const start=p+30+nl+xl;
    if(method!==0)throw new Error('archivio compresso: usa un archivio salvato dal Taccuino');
    out[name]=u8.subarray(start,start+size);p=start+size}
  return out;
}

function logChanges(r){
  const prev=lastSaved.get(r.id);const at=Date.now();const ch=[];
  if(!prev){ch.push({k:'_new',from:'',to:`${r.tipo} ${r.numero}`})}
  else{
    const keys=new Set([...Object.keys(prev),...Object.keys(r)]);
    keys.forEach(k=>{if(META.has(k)||k==='rel')return;const a=String(prev[k]??''),b=String(r[k]??'');if(a!==b)ch.push({k,from:a,to:b})});
    const rk=new Set([...Object.keys(prev.rel||{}),...Object.keys(r.rel||{})]);
    rk.forEach(k=>{const a=joinNums(prev.rel?.[k]),b=joinNums(r.rel?.[k]);if(a!==b)ch.push({k:'rel:'+k,from:a,to:b})});
    if((prev.foto_ids||[]).length!==(r.foto_ids||[]).length)ch.push({k:'_foto',from:String((prev.foto_ids||[]).length),to:String((r.foto_ids||[]).length)});
  }
  if(!ch.length)return;
  let st=(r.storia||[]).slice();
  ch.forEach(c=>{
    let li=-1;for(let i=st.length-1;i>=0&&at-st[i].at<15*60000;i--)if(st[i].k===c.k){li=i;break}
    const last=li>=0?st[li]:null;
    if(last&&last.by===(myId||null)){last.to=c.to;last.at=at;if(last.from===last.to)st.splice(li,1)}

}

/* ================= Foto degli appunti e trascrizione ================= */
async function shrink(file,max=1800){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85));}catch(e){return file}
}
const localBlobs=new Map(); /* id temporanei per foto non ancora caricate */
async function addPhoto(r,file){
  const img=await shrink(file);
  if(!assets){toast('Le foto richiedono la connessione all’archivio condiviso.');return}
  try{toast('Carico la foto…');const up=await assets.upload(img);r.foto_ids=[...(r.foto_ids||[]),up.id];localBlobs.set(up.id,img);saveRec(r);renderScheda()}
  catch(e){toast(!navigator.onLine?'Sei offline: scatta la foto ora e caricala quando torna la rete.':'Caricamento non riuscito: '+(e.message||e.code))}
}
let ocrState=null;
async function transcribe(r){
  if(!sample||!imgOK){toast('La trascrizione non è disponibile in questa vista.');return}
  const ids=r.foto_ids||[];if(!ids.length){toast('Aggiungi prima la foto dell’appunto.');return}
  ocrState={busy:true,items:[]};renderScheda();
  try{
    const blobs=[];for(const id of ids.slice(-3)){blobs.push(await getPhotoBlob(id))}
    const fields=allFields(r.tipo);
    const keyList=fields.map(f=>`"${f.k}": ${f.l}`).join('\n')+'\n'+RELS.map(([k,l])=>`"rel_${k}": ${l} (array di numeri US come stringhe)`).join('\n');
    const prompt=`Sei un archeologo esperto. Le immagini sono foto di appunti di campo (scritti a mano o su modulo cartaceo) per la scheda ${r.tipo} n. ${r.numero} secondo il modello ICCD. Trascrivi fedelmente in italiano quello che leggi, senza inventare né completare. Rispondi SOLO con un oggetto JSON che usa esclusivamente queste chiavi (ometti quelle che non compaiono negli appunti):\n${keyList}\nPer le date usa il formato AAAA-MM-GG. Se una parola è illeggibile scrivi [illeggibile].`;
    const out=await sample.json(prompt,{images:blobs,modelTier:'default'});
    const items=[];
    Object.entries(out||{}).forEach(([k,v])=>{
      if(k.startsWith('rel_')){const rk=k.slice(4);if(!RELINV[rk])return;const arr=parseNums(v);if(arr.length)items.push({k,rk,label:RELLAB[rk],v:arr.join(', '),arr,on:true})}
      else{const f=fields.find(x=>x.k===k);if(!f||v==null||String(v).trim()==='')return;items.push({k,label:f.l,v:String(v),on:!String(r[k]||'').trim()})}
    });
    ocrState={busy:false,items};
  }catch(e){ocrState=null;toast(e.code==='not_granted'?'Permesso negato per la trascrizione.':e.code==='rate_limited'?'Troppe richieste, riprova tra poco.':'Trascrizione non riuscita: '+(e.message||e.code))}
  renderScheda();
}
function applyOcr(r){
  if(!ocrState)return;
  ocrState.items.filter(i=>i.on).forEach(i=>{
    if(i.rk)setRelField(r,i.rk,parseNums([...shownRel(r,i.rk),...i.arr]));
    else if(i.k==='numero'){}
    else setField(r,i.k,i.v);
  });
  saveRec(r);ocrState=null;renderScheda();toast('Campi applicati alla scheda');
}

/* ---- Da validare ---- */

  const m=$('#main');const sc=curScavo();
  const props=Object.values(S.prop).sort((a,b)=>a.at-b.at);
  const recs=recsOf(S.cur).filter(r=>r.pend&&Object.keys(r.pend).length);
  const who=p=>p.byName?`proposta da ${esc(p.byName)}`:'proposta da un collaboratore';
  const when=t=>t?new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const fieldOf=vk=>{const k=vk.replace(/_(US|USM)$/,'');const f=[...allFields('US'),...allFields('USM')].find(x=>x.k===k);return (f?.l||k)+(vk.endsWith('_USM')?' (USM)':vk.endsWith('_US')?' (US)':'')};
  const total=props.length+recs.reduce((a,r)=>a+Object.keys(r.pend).length,0);
  m.innerHTML=`${roBanner()}<div class="sch-head"><div><h2>Da validare</h2><div class="muted small">${isOwnerV?'Approva o rifiuta le proposte dei collaboratori. Finché non le approvi, elenchi e schede ufficiali non cambiano.':'Le tue proposte e quelle dell’équipe, in attesa del responsabile scientifico.'}</div></div>
    ${isOwnerV&&total?`<button class="primary" id="okAll">Approva tutto (${total})</button>`:''}</div>
  ${props.length?`<section class="vgroup"><h3>Nuove voci per gli elenchi</h3>${props.map(p=>`<div class="vrow"><span class="t"><b>${esc(p.value)}</b> nell’elenco <i>${esc(fieldOf(p.vk))}</i><br><span class="muted small">${who(p)} · ${when(p.at)}</span></span>
    ${isOwnerV?`<button class="primary" data-pok="${esc(p.id)}">Approva</button><button class="ghost" data-pno="${esc(p.id)}">Rifiuta</button>`:''}</div>`).join('')}</section>`:''}
  ${recs.map(r=>`<section class="vgroup"><h3>${esc(r.tipo)} ${esc(r.numero)} <button class="ghost" data-open="${esc(r.id)}" style="float:right;min-height:30px;padding:2px 8px">Apri</button></h3>
    ${Object.keys(r.pend).map(pk=>{const p=r.pend[pk];const old=pendShow(r,pk,'o');return `<div class="vrow"><span class="t"><b>${esc(pendLabel(r,pk))}</b>: ${pk==='_delete'?'eliminare la scheda':`${old?`<s>${esc(old)}</s> → `:''}${esc(pendShow(r,pk,'v'))||'<i>vuoto</i>'}`}<br><span class="muted small">${who(p)} · ${when(p.at)}</span></span>
      ${isOwnerV?`<button class="primary" data-rok="${esc(r.id)}|${esc(pk)}">Approva</button><button class="ghost" data-rno="${esc(r.id)}|${esc(pk)}">Rifiuta</button>`:''}</div>`}).join('')}</section>`).join('')}
  ${total?'':`<div class="empty"><h3>Niente da validare</h3><p>${isOwnerV?'Quando un collaboratore propone una voce nuova o modifica un campo da validare, la trovi qui.':'Non ci sono proposte in attesa.'}</p></div>`}`;
  const pr=id=>S.prop[id];
  m.querySelectorAll('[data-pok]').forEach(b=>b.onclick=()=>{approveProp(pr(b.dataset.pok));renderValidare();renderHeader()});
  m.querySelectorAll('[data-pno]').forEach(b=>b.onclick=()=>{rejectProp(pr(b.dataset.pno));renderValidare();renderHeader()});
  const rp=v=>{const [id,pk]=v.split('|');return [S.records[id],pk]};
  m.querySelectorAll('[data-rok]').forEach(b=>b.onclick=()=>{const [r,pk]=rp(b.dataset.rok);if(r)approvePend(r,pk);renderValidare();renderHeader()});
  m.querySelectorAll('[data-rno]').forEach(b=>b.onclick=()=>{const [r,pk]=rp(b.dataset.rno);if(r)rejectPend(r,pk);renderValidare();renderHeader()});
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.open=b.dataset.open;ocrState=null;go('scheda')});
  const ok=$('#okAll');if(ok)ok.onclick=()=>{props.forEach(approveProp);recs.forEach(r=>Object.keys(r.pend||{}).forEach(pk=>{if(S.records[r.id])approvePend(S.records[r.id],pk)}));toast('Proposte approvate');renderValidare();renderHeader()};
}

function fieldLabelVk(vk){const k=vk.replace(/_(US|USM)$/,'');const f=[...allFields('US'),...allFields('USM')].find(x=>x.k===k);return (f?.l||k)+(vk.endsWith('_USM')?' (USM)':vk.endsWith('_US')?' (US)':'')}
/* ---- Voci da uniformare e fuori elenco (per i Controlli) ---- */
function vocabIssues(rs){
  const map=new Map();
  rs.forEach(r=>allFields(r.tipo).forEach(f=>{if(!PICK[f.k])return;const vk=vkey(f.k,r.tipo),list=vocabList(vk);
    (PICK[f.k]==='multi'?tokens(r[f.k]):[String(r[f.k]||'').trim()]).filter(Boolean).forEach(t=>{
      if(list.includes(t))return;const n=nearest(t,list);
      const key=vk+'|'+t;if(!map.has(key))map.set(key,{vk,k:f.k,from:t,to:n?n.x:null,nums:[]});map.get(key).nums.push(r.numero)})}));
  return [...map.values()].sort((a,b)=>(a.to?0:1)-(b.to?0:1)||a.from.localeCompare(b.from,'it'));
}
function uniform(it){
  recsOf(S.cur).forEach(r=>{if(vkey(it.k,r.tipo)!==it.vk)return;const multi=PICK[it.k]==='multi';
    const cur=multi?tokens(r[it.k]):[String(r[it.k]||'').trim()];if(!cur.includes(it.from))return;
    const nv=cur.map(t=>t===it.from?it.to:t).filter((t,j,a)=>a.findIndex(x=>nrm(x)===nrm(t))===j);
    r[it.k]=multi?nv.join(', '):nv[0];saveRec(r)});
}

/* ---- Proposta di uniformare una voce scritta a mano ---- */
function showHint(r,k,sugg){
  const h=$('#hint-'+k);if(!h)return;
  if(!sugg.length){h.hidden=true;h.innerHTML='';return}
  h.hidden=false;
  h.innerHTML=sugg.map((s,i)=>`<div class="hint-row">Intendevi <b>${esc(s.to)}</b>? <button type="button" data-use="${i}">Usa «${esc(s.to)}»</button><button type="button" class="ghost" data-keep="${i}">Tieni «${esc(s.from)}» come nuova voce</button></div>`).join('');
  const inp=$('#f-'+k);
  const done=i=>{sugg.splice(i,1);showHint(r,k,sugg)};
  h.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const s=sugg[+b.dataset.use];
    if(PICK[k]==='multi')inp.value=tokens(inp.value).map(t=>t===s.from?s.to:t).filter((t,j,a)=>a.findIndex(x=>nrm(x)===nrm(t))===j).join(', ');else inp.value=s.to;
    setField(r,k,inp.value);saveRec(r);done(+b.dataset.use)});
  h.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{const s=sugg[+b.dataset.keep];addVoce(vkey(k,r.tipo),s.from);done(+b.dataset.keep)});
}

/* ---- Revisione ortografica dei testi della scheda (Claude) ---- */
/* ---- Descrizione rapida: dal testo libero ai campi ---- */
let quickState=null;
const QUICK_KEYS=['definizione','geologici','organici','artificiali','colore','consistenza','conservazione','misure','forma','pareti','fondo','orientamento',
  'elementiDatanti','reperti','interpretazione','datazione','periodo','fase','attivita','osservazioni','descrizione','tecnica','funzioneStatica','modulo',
  'lat_materiali','lat_lavorazione','lat_consistenza','lat_forma','lat_colore','lat_impasto','lat_posa','lit_materiali','lit_lavorazione','lit_consistenza','lit_forma','lit_colore','lit_taglio','lit_posa',
  'materialiAltro','leg_tipo','leg_consistenza','leg_componenti','leg_colore','leg_finitura','leganteAltro','finitureOpera'];
function quickRevHtml(r){
  const q=quickState;if(!q||q.id!==r.id)return'';
  if(q.busy)return'<div class="ocr">Scompongo il testo…</div>';
  if(!q.items.length)return'<div class="ocr">Non ho riconosciuto campi in questo testo. <button class="ghost" id="qCancel">Chiudi</button></div>';
  return `<div class="ocr"><b>Ho capito così</b>${q.offline?' <span class="muted small">(senza rete: riconosco solo rapporti e voci degli elenchi)</span>':''} — togli la spunta a ciò che non va.
    <ul>${q.items.map((it,i)=>`<li><input type="checkbox" id="q${i}" data-q="${i}" ${it.on?'checked':''}><label for="q${i}"><b>${esc(it.label)}</b> ${esc(it.v)}${it.old?`<div class="old">ora: ${esc(it.old)}</div>`:''}</label></li>`).join('')}</ul>
    <div class="row"><button class="primary" id="qApply">Applica alla scheda</button><button class="ghost" id="qCancel">Annulla</button></div></div>`;
}
async function quickParse(r,text){
  const fields=allFields(r.tipo).filter(f=>QUICK_KEYS.includes(f.k));
  const lists=Object.fromEntries(fields.filter(f=>PICK[f.k]).map(f=>[f.k,[...vocabList(vkey(f.k,r.tipo)),...usedValues(f.k,r.tipo)]]));
  let out=null,offline=false;
  if(sample&&navigator.onLine){
    try{
      const keyList=fields.map(f=>`"${f.k}": ${f.l}${lists[f.k]?.length?` — usa se possibile una di queste voci: ${lists[f.k].slice(0,40).join(' | ')}`:''}`).join('\n');
      out=await sample.json(`Sei un archeologo. Scomponi questa descrizione dettata sul campo (scheda ${r.tipo} ${r.numero}, modello ICCD) nei campi della scheda.
Regole: non inventare nulla che non sia nel testo; normalizza alle voci elencate quando il significato coincide (es. "molto compatto" → "molto compatta", "frammenti ceramici" negli elementi datanti → "ceramica" se è la voce dell'elenco); gli aggettivi della matrice vanno nei componenti inorganici come sostantivi ("argilla sabbiosa" → "argilla, sabbia"); per i campi a più valori separa con virgola; "descrizione" è il testo dettato corretto e ripulito, SENZA i rapporti stratigrafici; i rapporti vanno nelle chiavi rel_ come array di numeri (stringhe).
Rispondi SOLO con un oggetto JSON con queste chiavi (ometti quelle assenti):
${keyList}
${RELS.map(([k,l])=>`"rel_${k}": ${l}`).join('\n')}

Testo: ${JSON.stringify(text)}`,{modelTier:'default'});
    }catch(e){out=null}
  }
  if(!out){offline=true;const lo=localExtract(text,r.tipo,lists);out={...lo};delete out.rel;Object.entries(lo.rel).forEach(([k,v])=>out['rel_'+k]=v)}
  const items=[];
  Object.entries(out||{}).forEach(([k,v])=>{
    if(k.startsWith('rel_')){const rk=k.slice(4);if(!RELINV[rk])return;const arr=parseNums(v).filter(n=>n!==r.numero);if(!arr.length)return;
      const cur=shownRel(r,rk);const add=arr.filter(n=>!cur.includes(n));if(!add.length)return;
      items.push({rk,label:'Sequenza: '+RELLAB[rk],v:add.join(', '),arr:add,old:cur.length?joinNums(cur):'',on:true});return}
    const f=fields.find(x=>x.k===k);if(!f||v==null)return;let val=Array.isArray(v)?v.join(', '):String(v).trim();if(!val)return;
    if(PICK[k])val=standardize(k,val,r.tipo).value;
    const old=String(shown(r,k)||'').trim();if(old===val)return;
    items.push({k,label:f.l,v:val,old,on:!old||k==='descrizione'});
  });
  const order=k=>{const i=QUICK_KEYS.indexOf(k);return i<0?99:i};
  items.sort((a,b)=>(a.rk?100:order(a.k))-(b.rk?100:order(b.k)));
  return{items,offline};
}
function bindQuick(r){
  const t=$('#quickTxt'),g=$('#quickGo');if(!t||!g)return;
  t.oninput=()=>{quickState={...(quickState?.id===r.id?quickState:{id:r.id,items:[]}),text:t.value}};
  g.onclick=async()=>{const text=t.value.trim();if(!text){toast('Scrivi o detta prima la descrizione.');t.focus();return}
    quickState={id:r.id,text,busy:true,items:[]};$('#quickRev').innerHTML=quickRevHtml(r);
    const res=await quickParse(r,text);quickState={id:r.id,text,busy:false,...res};$('#quickRev').innerHTML=quickRevHtml(r);bindQuickRev(r)};
  bindQuickRev(r);
}
function bindQuickRev(r){
  document.querySelectorAll('[data-q]').forEach(c=>c.onchange=()=>{quickState.items[+c.dataset.q].on=c.checked});
  const c=$('#qCancel');if(c)c.onclick=()=>{quickState={id:r.id,text:quickState.text,items:[]};$('#quickRev').innerHTML=''};
  const a=$('#qApply');if(!a)return;
  a.onclick=()=>{
    const it=quickState.items.filter(i=>i.on);const relAdded=[];
    it.forEach(i=>{
      if(i.rk){const old=shownRel(r,i.rk).slice();setRelField(r,i.rk,[...old,...i.arr]);relAdded.push(...i.arr)}
      else{setField(r,i.k,i.v);if(i.k==='descrizione')r.descAuto=false;else learnVocab(i.k,i.v,r.tipo)}
    });
    if(!it.some(i=>i.k==='descrizione'))autoDesc(r);
    checkStato(r);saveRec(r);
    const missing=[...new Set(relAdded)].filter(n=>!findNum(n,r.scavo));
    const cycles=findCycles(recsOf(r.scavo),(x,kk)=>shownRel(x,kk)).filter(cy=>cy.nums.includes(r.numero));
    const firstRel=it.find(i=>i.rk);
    relNotice=(missing.length||cycles.length)?{id:r.id,k:firstRel?.rk||'copre',old:[],pend:false,missing,cycles}:null;
    quickState=null;toast(`Applicati ${it.length} campi alla scheda`);
    const m=$('#main');const open=[...m.querySelectorAll('details.sec')].map(d=>d.open);renderScheda();m.querySelectorAll('details.sec').forEach((d,i)=>d.open=open[i]);
  };
}

let spellState=null;
async function spellCheck(r){
  const texts={};allFields(r.tipo).forEach(f=>{if(f.t==='date'||f.t==='select')return;const v=String(r[f.k]||'').trim();if(v&&/[a-zà-ú]{3}/i.test(v))texts[f.k]=v});
  if(!Object.keys(texts).length){toast('Non ci sono testi da controllare.');return}
  spellState={busy:true,items:[]};renderSpell(r);
  try{
    const out=await sample.json(`Sei un correttore di bozze per schede archeologiche in italiano. Correggi SOLO errori di ortografia, battitura, doppie, accenti e spaziatura (es. "sabiosa" → "sabbiosa", "chiaroe" → "chiaro e"). Non cambiare la terminologia tecnica, il registro, l'ordine delle parole né il contenuto; non aggiungere nulla. Rispondi SOLO con un oggetto JSON che contiene esclusivamente le chiavi dei campi che hai modificato, con il testo corretto completo.\n\n${JSON.stringify(texts)}`,{modelTier:'quick'});
    const lab=Object.fromEntries(allFields(r.tipo).map(f=>[f.k,f.l]));
    const items=Object.entries(out||{}).filter(([k,v])=>texts[k]!==undefined&&typeof v==='string'&&v.trim()&&v.trim()!==texts[k]).map(([k,v])=>({k,label:lab[k],from:texts[k],to:v.trim(),on:true}));
    spellState={busy:false,items};
  }catch(e){spellState=null;toast(e.code==='rate_limited'?'Troppe richieste, riprova tra poco.':'Controllo non riuscito: '+(e.message||e.code||'errore'))}
  renderSpell(r);
}
function renderSpell(r){
  const box=$('#spell');if(!box)return;
  if(!spellState){box.innerHTML='';box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=spellState.busy?'Rileggo i testi della scheda…':spellState.items.length?
    `<b>Correzioni proposte</b> — scegli quali applicare.<ul>${spellState.items.map((it,i)=>`<li><input type="checkbox" id="sp${i}" data-sp="${i}" ${it.on?'checked':''}><label for="sp${i}"><b>${esc(it.label)}</b> <s class="muted">${esc(it.from)}</s><br>${esc(it.to)}</label></li>`).join('')}</ul>
    <div class="row"><button class="primary" id="spApply">Applica le correzioni scelte</button><button class="ghost" id="spCancel">Annulla</button></div>`:
    `Nessun errore trovato nei testi di questa scheda. <button class="ghost" id="spCancel">Chiudi</button>`;
  box.querySelectorAll('[data-sp]').forEach(c=>c.onchange=()=>{spellState.items[+c.dataset.sp].on=c.checked});
  const a=$('#spApply');if(a)a.onclick=()=>{spellState.items.filter(i=>i.on).forEach(i=>{setField(r,i.k,i.to);const el=$('#f-'+i.k);if(el)el.value=i.to});saveRec(r);spellState=null;renderSpell(r);toast('Correzioni applicate')};
  const c=$('#spCancel');if(c)c.onclick=()=>{spellState=null;renderSpell(r)};
}

/* ---- Menu a tendina con voci modificabili ---- */
let pickOpen=null,pickEdit=false;
function closePicker(){
  if(!pickOpen)return;const p=$('#pk-'+pickOpen);if(p){p.hidden=true;p.innerHTML=''}
  const b=document.querySelector(`[data-pick="${pickOpen}"]`);if(b)b.setAttribute('aria-expanded','false');
  pickOpen=null;pickEdit=false;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pickOpen){const k=pickOpen;closePicker();document.querySelector(`[data-pick="${k}"]`)?.focus()}});
function renderPicker(){
  const r=S.records[S.open];const k=pickOpen;const box=k&&$('#pk-'+k);if(!r||!box)return;
  const vk=vkey(k,r.tipo),list=vocabList(vk),multi=PICK[k]==='multi',props=propsFor(vk).filter(v=>!list.some(x=>nrm(x)===nrm(v)));
  const inp=$('#f-'+k);const cur=multi?tokens(inp.value):[inp.value.trim()];
  const has=v=>cur.some(c=>c.toLowerCase()===v.toLowerCase());
  const used=usedValues(k,r.tipo).filter(v=>!props.some(x=>nrm(x)===nrm(v)));
  const chip=(v,cls='')=>`<button type="button" class="chip ${cls}${pickEdit&&!cls?' rm':''}" data-v="${esc(v)}" aria-pressed="${!pickEdit&&has(v)}">${esc(v)}</button>`;
  box.innerHTML=`<div class="pk-head">${multi?'Tocca una o più voci':'Tocca una voce'}${pickEdit?' · tocca una voce per toglierla dall’elenco':''}</div>
    <div class="pk-chips">${list.map(v=>chip(v)).join('')||'<span class="muted small">L’elenco è vuoto: aggiungi la prima voce qui sotto.</span>'}</div>
    ${props.length?`<div class="pk-head">Proposte in attesa di validazione</div><div class="pk-chips">${props.map(v=>chip(v,'prop')).join('')}</div>`:''}
    ${used.length?`<div class="pk-head">Già usate in questo scavo</div><div class="pk-chips">${used.map(v=>chip(v,'used')).join('')}</div>`:''}
    <div class="pk-add"><input id="pkNew" placeholder="Nuova voce" aria-label="Nuova voce per l’elenco"><button type="button" id="pkAdd">Aggiungi all’elenco</button></div>
    <div class="row"><button type="button" class="ghost" id="pkEdit">${pickEdit?'Fine modifiche':'Modifica l’elenco'}</button>${pickEdit?'<button type="button" class="ghost" id="pkReset">Ripristina le voci predefinite</button>':''}<span class="spacer"></span><button type="button" id="pkClose">Chiudi</button></div>`;
  const apply=v=>{
    inp.dataset.prev=inp.value;
    if(multi){const t=tokens(inp.value);const i=t.findIndex(x=>x.toLowerCase()===v.toLowerCase());if(i>=0)t.splice(i,1);else t.push(v);inp.value=t.join(', ')}
    else inp.value=has(v)?'':v;
    inp.dispatchEvent(new Event('change'));
    if(!multi)closePicker();else renderPicker();
  };
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const v=c.dataset.v;
    if(pickEdit&&!c.classList.contains('used')&&!c.classList.contains('prop')){setVocab(vk,list.filter(x=>x!==v));renderPicker();return}
    if(pickEdit){setVocab(vk,[...list,v]);renderPicker();return}
    apply(v);
  });
  const add=()=>{const v=$('#pkNew').value.trim();if(!v)return;
    addVoce(vk,v);
    if(!pickEdit)apply(v);else renderPicker();};
  $('#pkAdd').onclick=add;$('#pkNew').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  const pe=$('#pkEdit');if(pe)pe.onclick=()=>{pickEdit=!pickEdit;renderPicker()};
  const rs=$('#pkReset');if(rs)rs.onclick=()=>{setVocab(vk,[...(VOCAB[vk]||[])]);renderPicker()};
  $('#pkClose').onclick=()=>{const kk=pickOpen;closePicker();document.querySelector(`[data-pick="${kk}"]`)?.focus()};
}
function refreshFormValues(){
  const r=S.records[S.open];if(!r)return;const a=document.activeElement;
  document.querySelectorAll('#main [data-k]').forEach(el=>{if(el!==a&&el.value!==shown(r,el.dataset.k))el.value=shown(r,el.dataset.k)});
  document.querySelectorAll('#main [data-rel]').forEach(el=>{const v=joinNums(shownRel(r,el.dataset.rel));if(el!==a&&el.value!==v)el.value=v});
}

    ${canWrite&&i.kind==='missing'?`<button data-mk="${ix}">Crea la US ${esc(i.n)}</button>`:''}
    ${canWrite&&i.kind==='provv'?`<button data-okn="${ix}">Il numero è corretto</button>`:''}</div>`).join('')}</div>`:
    `<div class="empty"><h3>Nessun problema</h3><p>${rs.length?'Tutti i rapporti sono reciproci e la sequenza non ha contraddizioni.':'Qui compariranno i controlli quando avrai inserito le prime schede.'}</p></div>`}
  ${(()=>{const vi=vocabIssues(rs);if(!vi.length)return'';vocabIssues.cur=vi;
    return `<div class="sch-head" style="margin-top:22px"><div><h2>Voci da uniformare</h2><div class="muted small">Valori scritti a mano che non corrispondono alle voci degli elenchi.</div></div>
    ${canWrite&&vi.some(v=>v.to)?`<button class="primary" id="uniAll">Uniforma ${vi.filter(v=>v.to).length} voci simili</button>`:''}</div>
    <div class="issues">${vi.map((v,ix)=>`<div class="issue"><span class="sev ${v.to?'warn':'info'}">${v.to?'Simile':'Fuori elenco'}</span>
      <span class="t">«${esc(v.from)}»${v.to?` → «${esc(v.to)}»`:''} <span class="muted small">· ${esc(fieldLabelVk(v.vk))} · US ${esc(v.nums.slice().sort(numSort).join(', '))}</span></span>
      ${canWrite&&v.to?`<button data-uni="${ix}">Uniforma</button>`:''}
      ${canWrite?`<button class="ghost" data-addv="${ix}">Aggiungi all’elenco</button>`:''}</div>`).join('')}</div>`})()}`;
  m.querySelectorAll('[data-uni]').forEach(b=>b.onclick=()=>{uniform(vocabIssues.cur[+b.dataset.uni]);toast('Voce uniformata');renderControlli()});
  m.querySelectorAll('[data-addv]').forEach(b=>b.onclick=()=>{const v=vocabIssues.cur[+b.dataset.addv];addVoce(v.vk,v.from);toast('Voce aggiunta all’elenco');renderControlli()});
  const ua=$('#uniAll');if(ua)ua.onclick=()=>{vocabIssues.cur.filter(v=>v.to).forEach(uniform);toast('Voci uniformate');renderControlli()};
  m.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{const r=findNum(b.dataset.goto);if(r){S.open=r.id;ocrState=null;go('scheda')}});
  m.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{addMissing(iss[+b.dataset.fix]);renderControlli()});
  m.querySelectorAll('[data-okn]').forEach(b=>b.onclick=()=>{const r=findNum(iss[+b.dataset.okn].num);if(r){if(recsOf(S.cur).filter(x=>x.numero===r.numero).length>1){toast('Questo numero è usato da più schede: cambia il numero di una delle due.');return}delete r.numProvv;saveRec(r)}renderControlli()});
  m.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{createFromMissing(iss[+b.dataset.mk]);renderControlli()});
  const fa=$('#fixAll');if(fa)fa.onclick=()=>{recip.forEach(addMissing);toast('Rapporti reciproci completati');renderControlli()};
}

/* ---- Scavo ed esporta ---- */
const SCF=[['nome','Nome dello scavo',12],['ente','Ente responsabile',12],['ufficio','Ufficio MiC competente per tutela',12],['anno','Anno',4],['localita','Località',8],
  ['area','Area / edificio / struttura',6],['saggio','Saggio',6],['identificativo','Identificativo del saggio / edificio / struttura di riferimento',12],['respScientifico','Responsabile scientifico delle indagini',12]];
function renderScavo(){
  const m=$('#main');const sc=curScavo();const rs=sc?recsOf(sc.id):[];const ro=canWrite&&isSocio()?'':'readonly';
  const enti=[...new Set([...vocabList('ente'),...Object.values(S.scavi).map(x=>x.ente).filter(Boolean)])];
  const form=(s,pre)=>`<datalist id="dl-ente-${pre}">${enti.map(v=>`<option value="${esc(v)}">`).join('')}</datalist><div class="fields">${SCF.map(([k,l,w])=>`<label class="f c${w}"><span>${l}</span><input id="${pre}-${k}" data-sk="${k}" value="${esc(s?.[k]||'')}" ${k==='ente'||k==='ufficio'?`list="dl-ente-${pre}" placeholder="Scegli o scrivi"`:''} ${ro}></label>`).join('')}</div>`;
  m.innerHTML=`${roBanner()}<div class="cols">
  ${sc?`<section class="panel"><h3>Dati dello scavo</h3><p class="note">Compaiono in testa a ogni scheda esportata. Area e saggio sono i valori proposti per le nuove US.${isSocio()?'':' Li modificano solo i soci.'}</p>${form(sc,'sc')}</section>
`:''}
  <section class="panel"><h3>Esporta</h3>
    ${sc?`<div><b>Elenco US</b><p class="note">Con le stesse colonne del tuo foglio ELENCO_US_SCHEDE, così puoi incollarlo o usarlo con le unioni di documenti che hai già.</p>
    <div class="exp"><button id="eXlsx" ${rs.length?'':'disabled'}>Foglio Excel (.xlsx)</button><button id="eCsv" ${rs.length?'':'disabled'}>CSV</button></div></div>
    <div><b>Schede per la consegna in Soprintendenza</b><p class="note">In ordine di numero. Le schede da completare escono solo se le includi, con la dicitura “BOZZA”.</p>
    <label class="chk" style="margin:4px 0 8px"><input type="checkbox" id="inclBozze"> Includi le schede da completare (${rs.filter(r=>r.stato!=='completa').length})</label>
    <div class="exp"><button class="primary" id="ePdfZip" ${rs.length?'':'disabled'}>Un PDF per scheda (.zip)</button><button id="ePdf" ${rs.length?'':'disabled'}>Tutte in un unico PDF</button></div></div>`:''}
    <div><b>Schede vuote per il cartaceo</b><p class="note">Moduli ICCD con spazi per scrivere a mano${sc?', già intestati con i dati dello scavo':''}.</p>
    <div class="exp"><button id="bKp">US positiva vuota</button><button id="bKn">US negativa vuota</button><button id="bKs">US struttura (USM) vuota</button></div></div>
  </section>
  ${sc?respPanel(sc):''}
  ${isOwnerV&&db?rolesPanel():''}
  ${sc&&canWrite&&isSocio()?`<section class="panel"><h3>Importa un elenco esistente</h3><p class="note">Da Google Fogli: File → Scarica → CSV. Riconosco le colonne US, DEFINIZIONE, COLORE, CONSISTENZA, COPRE, COPERTO, TAGLIA e le altre del tuo elenco. Le US con lo stesso numero vengono aggiornate, le altre create.</p>
    <label class="btn" for="csvIn" style="align-self:flex-start">Scegli il file CSV</label><input id="csvIn" type="file" accept=".csv,text/csv" hidden><div id="impMsg" class="note"></div></section>`:''}
  ${STANDALONE?`<section class="panel"><h3>Accesso</h3><p class="note">Sei entrato come <b>${esc(API.user?.nome||'')}</b> (${esc(API.user?.username||'')}, ${esc(API.user?.ruolo||'')}) nell’archivio “${esc(API.archivio||'')}”. Il nome sulle schede si cambia nel foglio Utenti.</p>
    <button id="logout" style="align-self:flex-start">Esci</button></section>`
  :`<section class="panel"><h3>Il tuo nome</h3><p class="note">È legato al tuo account: compare sulle schede, nello storico e nell’elenco come compilatore.</p>
    <label class="f"><span>Nome</span><input id="me" value="${esc(S.me)}" placeholder="es. N. Fadini"></label></section>`}
  ${canWrite&&isSocio()?`<section class="panel"><h3>Nuovo scavo</h3>${form({anno:String(new Date().getFullYear())},'ns')}${STANDALONE?'<p class="note" style="margin:0">I PDF vanno nella cartella “Nome scavo - schede US”, dentro la cartella “Località – Scavo” con Dati e Foto, accanto al Foglio dell’archivio sul Drive del responsabile.</p>':destPicker('dn',null)}
    <p class="note" style="margin:0">Chi crea lo scavo ne diventa il responsabile di cantiere; potrà passare il ruolo a un altro socio.</p>
    <button class="primary" id="nsGo" style="align-self:flex-start">Crea lo scavo</button></section>`:''}
  </div>`;
  if(sc)m.querySelectorAll('[id^="sc-"]').forEach(el=>el.onchange=()=>{sc[el.dataset.sk]=el.value.trim();saveScavo(sc);if(el.dataset.sk==='ente')learnVocab('ente',el.value,'');renderHeader()});
  const meI=$('#me');if(meI)meI.onchange=e=>{S.me=e.target.value.trim();persist();registerMe()};
  const lo=$('#logout');if(lo)lo.onclick=logout;
  if(sc)bindRespPanel(sc);if(isOwnerV)bindRolesPanel();
  if(sc)m.querySelectorAll('[data-prot]').forEach(c=>c.onchange=()=>{sc.protetti=[...m.querySelectorAll('[data-prot]:checked')].map(x=>x.dataset.prot);saveScavo(sc)});
  const nm=s=>safe(s?.nome||s?.localita);
  const b=(id,fn)=>{const el=$('#'+id);if(el)el.onclick=fn};
  b('eXlsx',()=>offerFile(`Elenco_US_${nm(sc)}.xlsx`,buildXlsx(rs,sc)));
  b('eCsv',()=>offerFile(`Elenco_US_${nm(sc)}.csv`,buildCsv(rs,sc)));
  const sel=()=>{const all=$('#inclBozze')?.checked;const l=rs.filter(r=>all||r.stato==='completa');if(!l.length)toast('Nessuna scheda completa da esportare: completa le schede o includi quelle da completare.');return l};
  b('ePdf',()=>{const l=sel();if(l.length)exportPdf(l,sc,false,pdfNameMany(l))});
  b('ePdfZip',async()=>{const l=sel();if(!l.length)return;
    try{toast(`Preparo ${l.length} PDF…`);const files=[];for(const r of l){const bl=await buildPdf([r],sc,false);files.push({name:pdfName(r),data:new Uint8Array(await bl.arrayBuffer())})}
      const zip=new Blob([zipStore(files)]),zname=pdfNameMany(l,'zip');
      if(STANDALONE&&navigator.onLine){try{let res=null,i=0;for(const r of l){toast(`Salvo su Drive (${++i}/${l.length})…`);const bl=await buildPdf([r],sc,false);res=await pdfToDrive(sc,bl,pdfName(r))}
          $('#toast').hidden=true;savedBar(`${l.length} PDF salvati su Drive in “${folderName(sc)} / ${res?.nomeCartella||pdfFolderName(sc)}”.`,res?.cartella,()=>offerFile(zname,zip));return}
        catch(e){toast('Salvataggio su Drive non riuscito: '+e.message)}}
      await offerFile(zname,zip)}
    catch(e){toast(e.message==='offline'?'I PDF richiedono la connessione la prima volta.':'Esportazione non riuscita: '+e.message)}});
  const blankRec=t=>({tipo:t,numero:'',rel:{}});
  b('bKp',()=>exportPdf([{tipo:'US',segno:'positiva',numero:'',rel:{}}],sc,true,'Scheda_US_positiva_vuota.pdf'));
  b('bKn',()=>exportPdf([{tipo:'US',segno:'negativa',numero:'',rel:{}}],sc,true,'Scheda_US_negativa_vuota.pdf'));
  b('bKs',()=>exportPdf([{tipo:'USM',numero:'',rel:{}}],sc,true,'Scheda_US_struttura_vuota.pdf'));

  bindDestPicker('dn');
  b('nsGo',()=>{const s={id:uid('s'),createdAt:Date.now()};m.querySelectorAll('input[id^="ns-"][data-sk]').forEach(el=>s[el.dataset.sk]=el.value.trim());
    if(!s.nome&&!s.localita){toast('Dai almeno un nome o una località allo scavo.');$('#ns-nome').focus();return}
    const dest=STANDALONE?null:readDestPicker('dn');if(dest===undefined)return;
    if(dest)s.dest={...dest,ownerId:myId||null};if(myId)s.respId=myId;
    if(!s.nome)s.nome=s.localita;saveScavo(s);S.cur=s.id;S.open=null;persist();subscribeUS();toast(`Scavo “${s.nome}” creato`);go('elenco')});
  const ci=$('#csvIn');if(ci)ci.onchange=async()=>{const f=ci.files[0];if(!f)return;
    try{const rows=mapCsv(parseCsv(await f.text()));let nNew=0,nUpd=0;
      rows.forEach(o=>{let r=findNum(o.numero);const rel=o.rel;delete o.rel;
        if(r){Object.entries(o).forEach(([k,v])=>{if(v)r[k]=v});RELS.forEach(([k])=>{if(rel[k])r.rel={...(r.rel||{}),[k]:parseNums([...(r.rel?.[k]||[]),...rel[k]])}});saveRec(r);nUpd++}
        else{r={id:uid('r'),scavo:sc.id,tipo:'US',rel,foto_ids:[],area:sc.area||'',saggio:sc.saggio||'',createdAt:Date.now(),...o};saveRec(r);nNew++}});
      $('#impMsg').textContent=`Importate ${nNew} nuove schede, aggiornate ${nUpd}. Controlla la sezione Controlli per i rapporti da completare.`;renderHeader();
    }catch(e){$('#impMsg').textContent='Non riesco a leggere il file: verifica che sia un CSV con la riga di intestazione.'}
    ci.value=''};
}

boot();
</script>
